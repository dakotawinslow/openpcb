name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: openpcb
          POSTGRES_USER: openpcb
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Dummy values — sufficient for `manage.py test` and `manage.py check`.
      # STORAGES falls back to in-memory storage in test mode, so these R2
      # values are never used to make a real connection — `check` just
      # needs them present to build the settings dict.
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_DEBUG: 'False'
      DJANGO_ALLOWED_HOSTS: localhost
      DATABASE_URL: postgres://openpcb:postgres@localhost:5432/openpcb
      R2_ACCESS_KEY_ID: ci-dummy
      R2_SECRET_ACCESS_KEY: ci-dummy
      R2_BUCKET_NAME: ci-dummy
      R2_ENDPOINT_URL: https://ci-dummy.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run checks
        run: sh scripts/check.sh
