[project]
name = "openpcb"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "watchfiles>=1.2.0",
    "whitenoise",
    "psycopg[binary]",
    "django-allauth",
    "django-storages[s3]",
    "boto3",
    "django-environ",
    "Pillow",
    "gunicorn",
    "sentry-sdk>=2.62.0",
    "gerbonara",
]

[dependency-groups]
dev = [
    "ruff>=0.15.17",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "DJ",  # flake8-django
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501", "I001"]
