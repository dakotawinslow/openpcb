services:
  web:
    build: .
    # Host port is configurable via WEB_PORT in .env (defaults to 8000);
    # the container always listens on 8000 internally.
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - .:/app
    depends_on:
      - db
    env_file:
      - .env
    # Local dev: bypass the production entrypoint (gunicorn + migrate +
    # collectstatic) and run Django's auto-reloading dev server instead.
    entrypoint: []
    command: uv run python manage.py runserver 0.0.0.0:8000

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env

volumes:
  postgres_data:
