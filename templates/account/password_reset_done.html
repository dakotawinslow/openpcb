{% extends "core/base.html" %}

{% block title %}Check Your Email — OpenPCB{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-md">
    <div class="bg-white dark:bg-gray-900 p-8 ds-card chamfer-lg text-center">
      <div class="w-12 h-12 bg-brand-100 dark:bg-brand-900/40 flex items-center justify-center mx-auto mb-4 chamfer">
        <svg class="w-6 h-6 text-brand-600 dark:text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">Check your email</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">
        If an account exists for that address, a password reset link is on its way.
        Check your spam folder if you don't see it in a minute.
      </p>
      <a href="{% url 'account_login' %}"
        class="inline-block px-6 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm chamfer transition-colors">
        Back to log in
      </a>
    </div>
  </div>
</div>
{% endblock %}
