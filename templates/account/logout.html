{% extends "core/base.html" %}

{% block title %}Log Out — OpenPCB{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-sm">
    <div class="bg-white dark:bg-gray-900 p-8 ds-card chamfer-lg text-center">
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">Log out?</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">You'll be signed out of your account.</p>
      <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
        <button type="submit"
          class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm chamfer transition-colors">
          Log out
        </button>
      </form>
      <a href="/" class="block mt-3 text-sm text-gray-500 dark:text-gray-400 hover:text-brand-600 dark:hover:text-brand-400">
        Cancel
      </a>
    </div>
  </div>
</div>
{% endblock %}
