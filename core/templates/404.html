{% extends "core/base.html" %}

{% block title %}404 — Page Not Found — OpenPCB{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-32 text-center">

  <!-- PCB trace decoration -->
  <div class="flex justify-center mb-8">
    <svg class="w-32 h-32 text-brand-600 dark:text-brand-700 opacity-30" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="2.5">
      <polygon points="18,0 102,0 120,18 120,102 102,120 18,120 0,102 0,18" stroke-width="2"/>
      <path d="M20 60 L40 60 L55 45 L80 45"/>
      <path d="M20 75 L35 75 L55 55 L90 55 L90 80"/>
      <circle cx="40" cy="60" r="4" fill="currentColor"/>
      <circle cx="55" cy="55" r="4" fill="currentColor"/>
      <circle cx="80" cy="45" r="4" fill="currentColor"/>
      <circle cx="90" cy="80" r="4" fill="currentColor"/>
    </svg>
  </div>

  <p class="text-7xl font-extrabold text-brand-600 dark:text-brand-500 mb-4">404</p>
  <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-3">Board not found</h1>
  <p class="text-gray-500 dark:text-gray-400 mb-10 max-w-sm mx-auto">
    This page doesn't exist — it may have been moved, deleted, or the URL might be wrong.
  </p>

  <div class="flex flex-wrap items-center justify-center gap-4">
    <a href="/"
       class="px-6 py-2.5 text-sm font-semibold bg-brand-600 hover:bg-brand-700 text-white chamfer transition-colors">
      Go home
    </a>
    <a href="/explore/"
       class="px-6 py-2.5 text-sm font-semibold bg-white dark:bg-gray-900 text-gray-700 dark:text-gray-300 hover:text-brand-600 dark:hover:text-brand-400 chamfer ds-outline transition-colors">
      Browse designs
    </a>
  </div>

</div>
{% endblock %}
