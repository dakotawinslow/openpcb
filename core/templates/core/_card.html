<a href="{% url 'project_detail' project.id %}"
   class="group block bg-white dark:bg-gray-900 overflow-hidden chamfer-lg ds-card hover:-translate-y-0.5 transition-transform duration-200">

  <!-- Thumbnail -->
  <div class="aspect-[4/3] overflow-hidden bg-gray-100 dark:bg-gray-800">
    <img src="{{ project.thumbnail }}" alt="{{ project.title }}"
         class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
  </div>

  <!-- Content -->
  <div class="p-4">

    <h3 class="font-semibold text-gray-900 dark:text-white text-sm leading-tight mb-2 group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors">
      {{ project.title }}
    </h3>

    <!-- Author avatar + handle -->
    <div class="flex items-center gap-1.5 mb-3">
      <div class="w-5 h-5 bg-brand-100 dark:bg-brand-900 flex items-center justify-center flex-shrink-0 chamfer-sm">
        <span class="text-brand-700 dark:text-brand-400 text-xs font-semibold leading-none">{{ project.author|slice:":1"|upper }}</span>
      </div>
      <span class="text-xs text-gray-500 dark:text-gray-400">{{ project.author }}</span>
    </div>

    <!-- Download + star counts -->
    <div class="flex items-center gap-4 mb-3 text-xs text-gray-500 dark:text-gray-400">
      <span class="flex items-center gap-1">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        {{ project.downloads }}
      </span>
      <span class="flex items-center gap-1">
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24">
          <path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
        </svg>
        {{ project.stars }}
      </span>
    </div>

    <!-- Tags -->
    <div class="flex flex-wrap gap-1">
      {% for tag in project.tags|slice:":3" %}
      <span class="text-xs bg-brand-50 dark:bg-brand-900 text-brand-700 dark:text-brand-400 px-2 py-0.5 chamfer-sm ds-outline-brand">
        {{ tag }}
      </span>
      {% endfor %}
    </div>

  </div>
</a>
